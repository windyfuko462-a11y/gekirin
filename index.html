<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逆鱗ゲーム - Queen's Wrath</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&display=swap');
        
        body {
            font-family: 'Shippori Mincho', serif;
            background-color: #2D1B4E; /* Deep royal purple */
            background-image: radial-gradient(#4b2a75 1px, transparent 1px);
            background-size: 20px 20px;
            color: #fdfbf7;
        }

        /* 👑 UI Animations */
        .shake-little { animation: shake 0.5s ease-in-out infinite; }
        .shake-med { animation: shake 0.2s ease-in-out infinite; }
        .shake-hard { animation: shake 0.1s ease-in-out infinite; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px) rotate(-1deg); }
            75% { transform: translateX(2px) rotate(1deg); }
        }

        .explode-anim {
            animation: explode 0.5s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.5); filter: brightness(2) drop-shadow(0 0 20px red); }
            100% { transform: scale(1.2); filter: brightness(0.5); }
        }

        .glass-panel {
            background: rgba(25, 10, 40, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .log-container::-webkit-scrollbar {
            width: 8px;
        }
        .log-container::-webkit-scrollbar-thumb {
            background-color: #6b4c9a;
            border-radius: 4px;
        }

        .btn-hover-fx {
            transition: all 0.2s;
        }
        .btn-hover-fx:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="glass-panel w-full max-w-lg rounded-3xl p-6 relative overflow-hidden">
        
        <!-- Header / Status -->
        <header class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-yellow-400 mb-2 drop-shadow-md tracking-wider">逆鱗ゲーム</h1>
            <p class="text-sm text-purple-300 mb-4">- Queen's Wrath -</p>
            
            <div class="flex justify-between items-center bg-black/40 rounded-xl p-3 border border-yellow-600/50">
                <div class="text-left">
                    <span class="block text-xs text-gray-400">総資産 (Total)</span>
                    <span class="text-2xl font-bold text-yellow-400" id="total-bank">0 G</span>
                </div>
                <div class="text-right">
                    <span class="block text-xs text-gray-400">今回の給金 (Current)</span>
                    <span class="text-2xl font-bold text-green-400" id="current-wages">0 G</span>
                </div>
            </div>
        </header>

        <!-- Queen Area -->
        <section class="text-center my-8">
            <div id="queen-container" class="relative inline-block">
                <div id="queen-emoji" class="text-9xl transition-all duration-300 drop-shadow-2xl select-none">👸</div>
                <!-- Explosion overlay (hidden by default) -->
                <div id="explosion-effect" class="absolute inset-0 flex items-center justify-center opacity-0 pointer-events-none">
                    <span class="text-9xl">💥</span>
                </div>
            </div>
            
            <div class="mt-6 min-h-[4rem]">
                <p id="queen-mood-text" class="text-lg font-bold text-pink-200">女王は穏やかな表情だ。</p>
                <p id="danger-hint" class="text-sm text-red-400/80 mt-1">爆発の危険性: 極小</p>
            </div>
        </section>

        <!-- Controls -->
        <section id="action-panel" class="space-y-3">
            <div class="grid grid-cols-3 gap-2">
                <button onclick="playTurn('observe')" class="btn-hover-fx bg-blue-800 hover:bg-blue-700 border border-blue-500 rounded-lg p-2 text-sm flex flex-col items-center">
                    <span class="text-lg mb-1">👀</span>
                    <span>様子を見る</span>
                    <span class="text-[10px] text-gray-300 mt-1">低リスク</span>
                </button>
                <button onclick="playTurn('joke')" class="btn-hover-fx bg-purple-700 hover:bg-purple-600 border border-purple-400 rounded-lg p-2 text-sm flex flex-col items-center">
                    <span class="text-lg mb-1">🤡</span>
                    <span>軽いジョーク</span>
                    <span class="text-[10px] text-gray-300 mt-1">中リスク</span>
                </button>
                <button onclick="playTurn('stunt')" class="btn-hover-fx bg-red-800 hover:bg-red-700 border border-red-500 rounded-lg p-2 text-sm flex flex-col items-center">
                    <span class="text-lg mb-1">🎭</span>
                    <span>攻めたモノマネ</span>
                    <span class="text-[10px] text-gray-300 mt-1">高リスク</span>
                </button>
            </div>
            <button onclick="escape()" class="btn-hover-fx w-full bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 text-black font-bold text-lg rounded-xl p-3 shadow-[0_0_15px_rgba(255,215,0,0.4)] mt-2">
                🏃 退室する (給金を確定)
            </button>
        </section>

        <!-- Post-Round Controls (Hidden by default) -->
        <section id="result-panel" class="hidden mt-4">
            <button onclick="startRound()" class="btn-hover-fx w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-lg rounded-xl p-3 shadow-lg">
                次の拝謁へ進む (Next Round)
            </button>
        </section>

        <!-- Action Log -->
        <section class="mt-6">
            <div class="bg-black/50 rounded-lg p-3 h-24 overflow-y-auto log-container text-sm space-y-1" id="game-log">
                <p class="text-gray-400">王様の命により、女王を喜ばせるお時間が始まりました。</p>
            </div>
        </section>
    </main>

    <script>
        // Game State
        let state = {
            totalBank: 0,
            currentWages: 0,
            angerLevel: 0, // 0 to 100+
            turn: 0,
            isPlaying: true
        };

        // Action Definitions
        const actionData = {
            observe: { 
                name: "様子を見る", 
                riskRange: [2, 6], 
                rewardRange: [20, 50],
                logText: "道化師は当たり障りのない世間話をした。" 
            },
            joke: { 
                name: "軽いジョーク", 
                riskRange: [12, 20], 
                rewardRange: [100, 250],
                logText: "道化師は小粋なジョークを飛ばした！" 
            },
            stunt: { 
                name: "攻めたモノマネ", 
                riskRange: [25, 45], 
                rewardRange: [500, 1200],
                logText: "道化師は王様をバカにした過激なモノマネを披露した！！" 
            }
        };

        // Mood Stages based on Anger Level
        const moodStages = [
            { max: 15, emoji: "👸", text: "女王は退屈そうにしている。", hint: "危険性: 極小", cssClass: "" },
            { max: 35, emoji: "🤨", text: "女王は扇子を指で叩いている。", hint: "危険性: 小", cssClass: "" },
            { max: 60, emoji: "😠", text: "女王は貧乏ゆすりを始めた…", hint: "危険性: 中", cssClass: "shake-little" },
            { max: 85, emoji: "😡", text: "女王の目が完全に据わっている！", hint: "危険性: 高", cssClass: "shake-med text-red-500" },
            { max: 999, emoji: "🤬", text: "今にも爆発しそうだ！！", hint: "危険性: 極大 (即死級)", cssClass: "shake-hard text-red-600" }
        ];

        // Utility Function for Random Numbers
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Add text to the log
        function addLog(message, colorClass = "text-white") {
            const logBox = document.getElementById('game-log');
            const p = document.createElement('p');
            p.className = colorClass;
            p.innerText = message;
            logBox.appendChild(p);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function playTurn(actionKey) {
            if (!state.isPlaying) return;

            const action = actionData[actionKey];
            state.turn++;
            
            // 1. Calculate and add risk (Anger)
            const addedAnger = getRandomInt(action.riskRange[0], action.riskRange[1]);
            state.angerLevel += addedAnger;
            
            addLog(`【ターン${state.turn}】 ${action.logText}`, "text-blue-300");

            // 2. Check for Explosion
            // The explosion probability is strictly based on the newly updated anger level.
            const roll = getRandomInt(1, 100);
            const exploded = roll <= state.angerLevel;

            if (exploded) {
                triggerExplosion();
                return;
            }

            // 3. Success! Calculate and add reward
            const reward = getRandomInt(action.rewardRange[0], action.rewardRange[1]);
            // exponential-like scaling based on how long you stay
            const multiplier = 1 + (state.turn * 0.2); 
            const finalReward = Math.floor(reward * multiplier);
            
            state.currentWages += finalReward;
            
            addLog(`ウケた！ 給金 ${finalReward}G を獲得。（現在: ${state.currentWages}G）`, "text-green-300");
            
            updateUI();
        }

        function triggerExplosion() {
            state.isPlaying = false;
            state.currentWages = 0;
            
            const queenEmoji = document.getElementById('queen-emoji');
            const explosionFX = document.getElementById('explosion-effect');
            
            queenEmoji.innerText = "🤬";
            queenEmoji.className = "text-9xl transition-all duration-300 drop-shadow-2xl select-none explode-anim";
            
            explosionFX.classList.remove('opacity-0');
            explosionFX.classList.add('opacity-100', 'animate-ping');
            setTimeout(() => { explosionFX.classList.remove('animate-ping'); }, 500);

            document.getElementById('queen-mood-text').innerText = "「ええい、首を刎ねよ！！！！」";
            document.getElementById('queen-mood-text').className = "text-xl font-bold text-red-500 animate-pulse";
            document.getElementById('danger-hint').innerText = "女王は激怒し、爆発した！";
            
            addLog(`💥 女王の逆鱗に触れた！ 今回の給金は没収された！`, "text-red-500 font-bold");
            
            togglePanels(false);
            updateStatsOnly();
        }

        function escape() {
            if (!state.isPlaying || state.currentWages === 0) return;
            
            state.isPlaying = false;
            state.totalBank += state.currentWages;
            
            addLog(`🏃 道化師はさっさと退室した。 ${state.currentWages}G を総資産に加えた！`, "text-yellow-400 font-bold");
            state.currentWages = 0; // Reset after banking
            
            togglePanels(false);
            updateStatsOnly();
        }

        function togglePanels(isPlaying) {
            document.getElementById('action-panel').style.display = isPlaying ? 'block' : 'none';
            document.getElementById('result-panel').style.display = isPlaying ? 'none' : 'block';
        }

        function getMoodState() {
            for (let mood of moodStages) {
                if (state.angerLevel <= mood.max) {
                    return mood;
                }
            }
            return moodStages[moodStages.length - 1];
        }

        function updateUI() {
            updateStatsOnly();
            
            const mood = getMoodState();
            
            const queenEmoji = document.getElementById('queen-emoji');
            queenEmoji.innerText = mood.emoji;
            queenEmoji.className = `text-9xl transition-all duration-300 drop-shadow-2xl select-none ${mood.cssClass}`;
            
            document.getElementById('queen-mood-text').innerText = mood.text;
            document.getElementById('queen-mood-text').className = "text-lg font-bold text-pink-200";
            document.getElementById('danger-hint').innerText = mood.hint;
        }

        function updateStatsOnly() {
            document.getElementById('total-bank').innerText = `${state.totalBank} G`;
            document.getElementById('current-wages').innerText = `${state.currentWages} G`;
        }

        function startRound() {
            state.currentWages = 0;
            state.angerLevel = 0;
            state.turn = 0;
            state.isPlaying = true;
            
            // Reset visuals
            document.getElementById('explosion-effect').classList.add('opacity-0');
            document.getElementById('explosion-effect').classList.remove('opacity-100');
            
            document.getElementById('game-log').innerHTML = '<p class="text-gray-400">王様の命により、女王を喜ばせるお時間が始まりました。</p>';
            
            togglePanels(true);
            updateUI();
        }

        // Initialize first round on load
        startRound();
    </script>
</body>
</html>
